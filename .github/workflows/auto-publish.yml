name: Auto Publish On Gravity Articles

on:
  schedule:
    # Off-peak minute schedules (UTC):
    # 04:23 UTC = 09:23 AM PKT (primary morning trigger on odd minute to avoid delays)
    # 06:47 UTC = 11:47 AM PKT (secondary fallback trigger)
    # 09:19 UTC = 02:19 PM PKT (afternoon fallback trigger)
    # The script strictly enforces maximum 1 article per day via an 18-hour interval guard.
    - cron: '23 4 * * *'
    - cron: '47 6 * * *'
    - cron: '19 9 * * *'
  workflow_dispatch: # Allows manual trigger if explicitly started by admin

permissions:
  contents: write
  actions: write

jobs:
  auto-publish-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Cloud Auto-Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cloud-auto-publish.js
