name: Auto Publish On Gravity Articles (Disabled)

# Auto-publishing schedule disabled per user request
on:
  # schedule:
  #   - cron: '0 */7 * * *'
  workflow_dispatch: # Manual trigger only if needed

permissions:
  contents: write

jobs:
  auto-publish-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cloud Auto-Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: echo "Auto-publishing is currently disabled."
