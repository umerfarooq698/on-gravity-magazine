name: Auto Publish On Gravity Articles (Pending Schedule Confirmation)

# Schedule paused for user schedule confirmation
on:
  # schedule:
  #   - cron: '0 */3 * * *'
  workflow_dispatch: # Manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  auto-publish-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cloud Auto-Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/cloud-auto-publish.js
