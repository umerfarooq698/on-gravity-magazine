name: Auto Publish On Gravity Articles

on:
  schedule:
    # Runs every 6 hours automatically (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  auto-publish-job:
    runs-on: ubuntu-latest
    steps:
      - name: Call Auto-Publish API
        run: |
          echo "Triggering On Gravity Auto-Publish API..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://on-gravity-magazine.vercel.app/api/cron/publish")
          echo "$RESPONSE"
