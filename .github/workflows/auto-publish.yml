name: Auto Publish On Gravity Articles

on:
  schedule:
    # 3 articles published at 00:00, 03:00, 06:00 UTC (3 hours gap each), followed by EXACT 15 hours pause (09:00 to 00:00 UTC) before repeating daily
    - cron: '0 0,3,6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  auto-publish-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cloud Auto-Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/cloud-auto-publish.js
