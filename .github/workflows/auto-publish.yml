name: Auto Publish On Gravity Articles

on:
  schedule:
    # 3 articles published per 24h aligned with Pakistan Time (PKT = UTC+5):
    # 1st Article: 12:05 PM PKT (07:05 UTC)
    # 2nd Article: 03:05 PM PKT (10:05 UTC) - 3h gap
    # 3rd Article: 06:05 PM PKT (13:05 UTC) - 3h gap
    # Followed by EXACT 15-hour pause
    - cron: '5 7,10,13 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab
  repository_dispatch:
    types: [auto_publish]

permissions:
  contents: write

jobs:
  auto-publish-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cloud Auto-Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/cloud-auto-publish.js
