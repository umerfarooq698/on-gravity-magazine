<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" fill="none">
  <!-- Emblem Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Red Shield -->
    <rect width="100" height="100" rx="20" fill="#DC2626" />
    
    <!-- Dark Navy Inner Container -->
    <rect x="6" y="6" width="88" height="88" rx="15" fill="#001933" />
    
    <!-- Red Gravity Orbital Ring -->
    <path
      d="M 22 50 C 22 30, 78 30, 78 50 C 78 70, 22 70, 22 50 Z"
      stroke="#DC2626"
      stroke-width="6"
      fill="none"
      stroke-linecap="round"
    />
    
    <!-- Bold White G Monogram -->
    <path
      d="M 68 38 C 62 30, 42 30, 36 42 C 28 54, 34 70, 52 70 C 65 70, 68 60, 68 52 L 50 52 L 50 44 L 76 44 L 76 56 C 76 72, 58 78, 44 78 C 24 78, 18 58, 26 40 C 34 22, 60 22, 74 32 Z"
      fill="#FFFFFF"
    />

    <!-- Gold Star Accent -->
    <polygon points="76,20 79,27 86,27 80,31 82,38 76,33 70,38 72,31 66,27 73,27" fill="#F59E0B" />
  </g>

  <!-- Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
    <!-- ON GRAVITY Text -->
    <text x="128" y="73" font-size="44" font-weight="900" letter-spacing="-1.5" fill="#0F172A">ON GRAVITY</text>
    
    <!-- MAGAZINE Badge -->
    <g transform="translate(420, 43)">
      <rect width="150" height="34" rx="4" fill="#DC2626" />
      <text x="75" y="23" text-anchor="middle" font-size="16" font-weight="900" letter-spacing="2.5" fill="#FFFFFF">MAGAZINE</text>
    </g>
  </g>
</svg>