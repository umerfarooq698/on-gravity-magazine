<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer Red Shield -->
  <rect width="100" height="100" rx="20" fill="#DC2626" />
  
  <!-- Dark Navy Inner Container -->
  <rect x="6" y="6" width="88" height="88" rx="15" fill="#0A1128" />
  
  <!-- Red Gravity Orbital Ring -->
  <path
    d="M 20 50 C 20 28, 80 28, 80 50 C 80 72, 20 72, 20 50 Z"
    stroke="#DC2626"
    strokeWidth="7"
    fill="none"
    strokeLinecap="round"
  />
  
  <!-- Bold White 'G' Monogram -->
  <path
    d="M 68 38 C 62 30, 42 30, 36 42 C 28 54, 34 70, 52 70 C 65 70, 68 60, 68 52 L 50 52 L 50 44 L 76 44 L 76 56 C 76 72, 58 78, 44 78 C 24 78, 18 58, 26 40 C 34 22, 60 22, 74 32 Z"
    fill="#FFFFFF"
  />

  <!-- Gold Star Accent -->
  <polygon points="76,18 79,25 86,25 80,29 82,36 76,31 70,36 72,29 66,25 73,25" fill="#F59E0B" />
</svg>
